<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Cart - Smart Collaborative Shopping List</title>

    <!-- Web App Capability Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Family Cart">
    <meta name="theme-color" content="#059669">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .item-enter {
            animation: slideIn 0.2s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen">

    <!-- APP CONTAINER -->
    <div id="app" class="flex-1 flex flex-col w-full max-w-lg mx-auto bg-white min-h-screen shadow-xl relative pb-32">

        <!-- HEADER BANNER -->
        <header class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-4 sticky top-0 z-30 shadow-md">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-white/25 backdrop-blur rounded-xl flex items-center justify-center">
                        <i class="fa-solid fa-cart-shopping text-white text-xl"></i>
                    </div>
                    <div>
                        <h1 class="font-extrabold text-xl leading-tight tracking-tight">FamilyCart</h1>
                        <p id="connectionStatus" class="text-xs text-emerald-100 flex items-center gap-1.5 mt-0.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-300 animate-pulse"></span>
                            Cloud Sync Active
                        </p>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex items-center space-x-2">
                    <button onclick="shareCurrentList()" class="bg-white/20 hover:bg-white/30 active:scale-95 transition px-3 py-2 rounded-xl text-white text-xs font-bold flex items-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-share-nodes text-sm"></i>
                        <span>Share</span>
                    </button>
                    <button onclick="toggleListModal(true)" class="bg-white/20 hover:bg-white/30 active:scale-95 transition p-2.5 rounded-xl text-white text-sm font-bold shadow-sm">
                        <i class="fa-solid fa-list-ul"></i>
                    </button>
                </div>
            </div>

            <!-- Current List Info Bar -->
            <div class="bg-white/15 backdrop-blur-md rounded-xl p-3 flex items-center justify-between border border-white/10">
                <div class="flex items-center space-x-2 truncate">
                    <i class="fa-solid fa-folder-open text-emerald-200"></i>
                    <span id="currentListName" class="font-bold text-sm truncate">Family Groceries</span>
                </div>
                <div class="flex items-center space-x-2 flex-shrink-0">
                    <span id="itemCountBadge" class="bg-emerald-900/50 text-emerald-100 text-xs px-2.5 py-1 rounded-full font-semibold">0 items</span>
                </div>
            </div>
        </header>

        <!-- TOOLBAR -->
        <div class="bg-slate-50 px-4 py-3 border-b border-slate-200 flex items-center justify-between gap-3 sticky top-[116px] z-20 shadow-sm">
            <button id="sortToggleBtn" onclick="toggleSortMode()" class="flex-1 bg-white hover:bg-slate-100 active:bg-slate-200 text-slate-700 py-2.5 px-3 rounded-xl font-bold text-xs flex items-center justify-center gap-2 transition border border-slate-200 shadow-sm">
                <i class="fa-solid fa-layer-group text-emerald-600 text-sm"></i>
                <span id="sortBtnText">Group by Category</span>
            </button>
            <button onclick="clearTrolleyItems()" class="bg-white hover:bg-rose-50 text-slate-600 hover:text-rose-600 py-2.5 px-3 rounded-xl font-bold text-xs flex items-center justify-center gap-2 transition border border-slate-200 shadow-sm">
                <i class="fa-regular fa-trash-can text-sm"></i>
                <span>Clear Done</span>
            </button>
        </div>

        <!-- MAIN LIST AREA -->
        <main class="flex-1 p-4 space-y-4 overflow-y-auto" id="mainListContainer">
            <div id="activeItemsContainer" class="space-y-2.5"></div>

            <div id="trolleySection" class="pt-6 border-t-2 border-dashed border-slate-200 hidden">
                <div class="flex items-center justify-between mb-3 px-1">
                    <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                        <i class="fa-solid fa-basket-shopping text-emerald-600"></i>
                        In Trolley (<span id="trolleyCount">0</span>)
                    </h2>
                    <span class="text-[11px] font-medium text-slate-400">Tap item to put back</span>
                </div>
                <div id="trolleyItemsContainer" class="space-y-2.5 opacity-80"></div>
            </div>

            <div id="emptyListState" class="hidden flex-col items-center justify-center py-16 text-center px-4">
                <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mb-3 text-emerald-600">
                    <i class="fa-solid fa-basket-shopping text-2xl"></i>
                </div>
                <h3 class="font-bold text-slate-700 text-base">Your shopping list is empty</h3>
                <p class="text-slate-400 text-xs mt-1 max-w-xs">Add items below to share them with family in real time!</p>
            </div>
        </main>

        <!-- ADD ITEM FLOATING BAR -->
        <div class="fixed bottom-0 left-0 right-0 w-full max-w-lg mx-auto bg-white border-t border-slate-200 p-3.5 shadow-2xl z-30">
            <form id="addItemForm" onsubmit="handleAddItem(event)" class="flex flex-col space-y-2.5">
                <div class="flex items-center space-x-2">
                    <div class="relative flex-1">
                        <input type="text" id="itemNameInput" placeholder="Add item (e.g. Milk, Bread)..." 
                               required autocomplete="off"
                               class="w-full bg-slate-100 text-slate-900 text-sm rounded-xl pl-3.5 pr-8 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500 border border-slate-200">
                        <button type="button" onclick="clearInput()" id="clearInputBtn" class="hidden absolute right-3 top-3 text-slate-400 hover:text-slate-600 p-1">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <div class="w-16">
                        <input type="number" id="itemQtyInput" placeholder="Qty" min="1" value="1"
                               class="w-full bg-slate-100 text-slate-900 text-sm font-semibold text-center rounded-xl py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500 border border-slate-200">
                    </div>

                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-3 px-5 rounded-xl shadow-md transition flex items-center justify-center gap-1.5 flex-shrink-0">
                        <i class="fa-solid fa-plus"></i>
                        <span class="text-xs">Add</span>
                    </button>
                </div>

                <!-- Category Pills Bar -->
                <div class="flex items-center space-x-2 overflow-x-auto pb-1 no-scrollbar">
                    <span class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider flex-shrink-0">Category:</span>
                    <div id="categoryP
